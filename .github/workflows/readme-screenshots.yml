name: Refresh ASTRA README screenshots

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-readme.mjs'
      - '.github/workflows/readme-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-readme-captures
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install ASTRA and browser dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1 sharp@0.34.4
          npx playwright install --with-deps chromium
      - name: Start the current ASTRA application
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/astra-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/astra-vite.log
          exit 1
      - name: Create three new browser screenshots
        run: node scripts/capture-readme.mjs
      - name: Upload screenshot review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-README-screenshots
          path: docs/screenshots/*.webp
          if-no-files-found: warn
      - name: Replace all previous README screenshots on main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo 'README screenshots are unchanged.'
            exit 0
          fi
          git commit -m 'Replace outdated README screenshots with fresh ASTRA browser captures'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((2*attempt))
          done
          exit 1
