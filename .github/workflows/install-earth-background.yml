name: Install licensed Earth background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-earth-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  background:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and validate Pixabay image
        run: |
          python3 - <<'PY'
          import urllib.request, struct
          url="https://cdn.pixabay.com/photo/2022/03/16/07/35/stars-7071805_1920.jpg"
          request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(request,timeout=30) as response:
              data=response.read()
          if len(data)<20000 or not data.startswith(b"\xff\xd8\xff"):
              raise RuntimeError("Pixabay artwork missing or incorrect - refusing to replace background")
          with open("public/earth-background.jpg","wb") as f: f.write(data)
          print("Saved licensed Earth background", len(data), "bytes")
          PY
      - name: Commit separate Earth background
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/earth-background.jpg
          git commit -m 'Install Pixabay stars background for Earth screen only'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
